<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人主頁</title>
    
    <!-- 引入 jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h1 id="title">個人主頁</h1>
    <p>姓名：曾宜婕</p>
    <p>學號：414570277</p>

    <!-- 測試 jQuery 功能的按鈕 -->
    <button id="btn">測試 jQuery 功能</button>

    <script>
        // jQuery 點擊事件測試
        $(document).ready(function() {
            $('#btn').click(function() {
                $('#title').css('color', 'blue');
                alert('jQuery 運作正常！');
            });
        });
    </script>

</body>
</html>
