<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 GitHub 個人主頁</title>
    
    <!-- 引入 jQuery 3.7.1 CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1 id="main-title">歡迎來到我的 GitHub Pages！</h1>
    <p>這是我的個人主頁，並且已經成功載入 jQuery。</p>
    
    <!-- 互動按鈕測試 jQuery -->
    <button id="change-btn">點我測試 jQuery 效果</button>

    <script>
        // 使用 jQuery 撰寫的互動效果
        $(document).ready(function() {
            $('#change-btn').click(function() {
                $('#main-title').text('jQuery 互動測試成功！').css('color', 'red');
                $(this).text('已經點擊過囉！').prop('disabled', true);
            });
        });
    </script>

</body>
</html>
